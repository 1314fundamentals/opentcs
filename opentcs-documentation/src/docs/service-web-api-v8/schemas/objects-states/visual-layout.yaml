components:
  schemas:
    VisualLayout:
      type: object
      properties:
        name:
          type: string
        properties:
          type: object
          additionalProperties:
            type: string
        scaleX:
          type: number
          format: double
        scaleY:
          type: number
          format: double
        layers:
          type: array
          items:
            $ref: '#/components/schemas/Layer'
        layerGroups:
          type: array
          items:
            $ref: '#/components/schemas/LayerGroup'
        images:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Image'
      required:
        - name
        - properties
        - history
        - scaleX
        - scaleY
        - layers
        - layerGroups
        - images
    Layer:
      type: object
      properties:
        id:
          type: integer
        ordinal:
          type: integer
        name:
          type: string
        visible:
          type: boolean
        groupId:
          type: integer
        backgroundImage:
          $ref: '#/components/schemas/ImageReference'
      required:
        - id
        - ordinal
        - name
        - visible
        - groupId
    LayerGroup:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        visible:
          type: boolean
      required:
        - id
        - name
        - visible
    Image:
      type: object
      properties:
        id:
          type: string
        mediaType:
          type: string
        data:
          type: string
          format: byte
      required:
        - id
        - mediaType
        - data
    ImageReference:
      type: object
      properties:
        imageRef:
          type: string
        positionOffset:
          $ref: 'common.yaml#/components/schemas/Couple'
        sizeX:
          type: number
          format: integer
      required:
        - imageRef
        - positionOffset
        - sizeX
